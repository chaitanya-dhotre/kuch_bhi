name: kuch_bhi
description: A private encrypted messaging app for friends.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- State Management ---
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # --- Navigation ---
  go_router: ^14.6.2

  # --- Local Database ---
  drift: ^2.22.1
  sqlite3_flutter_libs: 0.5.28
  path: ^1.9.0

  # --- Secure Storage ---
  flutter_secure_storage: ^9.2.2

  # --- Networking ---
  dio: ^5.7.0
  pocketbase: ^0.21.0
  http: ^1.6.0
  http_parser: ^4.1.2

  # --- Authentication ---
  google_sign_in: ^6.2.2
  local_auth: ^2.3.0

  # --- Encryption ---
  cryptography: ^2.7.0

  # --- Firebase ---
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.5

  # --- Notifications ---
  flutter_local_notifications: ^18.0.1
  flutter_background_service: ^5.0.10

  # --- Media ---
  image_picker: ^1.1.2
  video_player: ^2.9.2
  just_audio: ^0.9.42
  record: ^6.2.0
  flutter_image_compress: ^2.3.0
  cached_network_image: ^3.4.1
  photo_view: ^0.15.0
  file_picker: ^8.1.2
  video_compress: ^3.1.3
  chewie: ^1.8.5
  open_file: ^3.5.7
  mime: ^1.0.6

  # --- QR ---
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2

  # --- UI ---
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  flutter_svg: ^2.2.0

  # --- Permissions ---
  permission_handler: ^11.3.1

  # --- File System ---
  path_provider: ^2.1.4
  gal: ^2.3.1

  # --- Utils ---
  share_plus: ^10.0.0
  url_launcher: ^6.3.1
  connectivity_plus: ^6.1.1
  package_info_plus: ^8.1.0
  intl: ^0.20.1
  uuid: ^4.5.1
  collection: ^1.19.1
  marionette_flutter: ^0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.22.1
  riverpod_generator: ^2.6.1
  riverpod_lint: ^2.6.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans/PlusJakartaSans-VF.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700








